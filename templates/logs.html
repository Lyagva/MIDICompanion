<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI Logs - MIDI Companion</title>
  <link rel="icon" href="{{ url_for('static', filename='icon256.ico') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='companion.css') }}">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    .log-entry {
      animation: fadeIn 0.2s ease-in;
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .noteon { color: #10b981; font-weight: 600; }
    .noteoff { color: #ef4444; font-weight: 600; }
    .log-container {
      background: #f9fafb;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1rem;
      height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="flex flex-gap-md mb-lg" style="align-items: center;">
      <a href="{{ url_for('index') }}" class="link">← Back to Connections</a>
      <h1>MIDI Event Logs</h1>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Live MIDI Events</h2>
        <div class="flex flex-gap-md" style="align-items: center;">
          <div class="status-indicator status-checking" id="connection-status">
            <span>Connecting...</span>
          </div>
          <button id="clear-logs" class="btn btn-danger btn-sm">Clear Logs</button>
        </div>
      </div>

      <div class="log-container" id="log-container">
        <div id="logs"></div>
      </div>

      <p class="text-xs text-secondary mt-md">
        <strong>Note:</strong> Only NOTEON and NOTEOFF events are shown. Events are logged regardless of whether they have bindings configured.
      </p>
    </div>
  </div>

  <script>
    const socket = io();
    const logsContainer = document.getElementById('logs');
    const logContainerDiv = document.getElementById('log-container');
    const statusSpan = document.getElementById('connection-status');
    const clearButton = document.getElementById('clear-logs');

    let autoScroll = true;

    logContainerDiv.addEventListener('scroll', () => {
      const isAtBottom = logContainerDiv.scrollHeight - logContainerDiv.scrollTop <= logContainerDiv.clientHeight + 50;
      autoScroll = isAtBottom;
    });

    socket.on('connect', () => {
      console.log('Connected to WebSocket');
      statusSpan.className = 'status-indicator status-connected';
      statusSpan.innerHTML = '<span>Connected</span>';
    });

    socket.on('disconnect', () => {
      console.log('Disconnected from WebSocket');
      statusSpan.className = 'status-indicator status-disconnected';
      statusSpan.innerHTML = '<span>Disconnected</span>';
    });

    socket.on('midi_event', (data) => {
      const logEntry = document.createElement('div');
      logEntry.className = 'log-entry';

      const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
      const eventClass = data.event === 'NOTEON' ? 'noteon' : 'noteoff';

      logEntry.innerHTML = `
        <span style="color: #6b7280;">[${timestamp}]</span>
        <span style="color: #3b82f6; font-weight: 600;">${data.connection}</span>
        <span class="${eventClass}">${data.event}</span>:
        <span style="color: #8b5cf6;">${data.channel}ch</span>
        <span style="color: #f59e0b;">${data.note} note</span>
      `;

      logsContainer.appendChild(logEntry);

      while (logsContainer.children.length > 200) {
        logsContainer.removeChild(logsContainer.firstChild);
      }

      if (autoScroll) {
        logContainerDiv.scrollTop = logContainerDiv.scrollHeight;
      }
    });

    clearButton.addEventListener('click', () => {
      logsContainer.innerHTML = '';
    });
  </script>
</body>
</html>
